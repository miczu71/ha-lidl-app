<!doctype html>
<html lang="pl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Lidl Plus{% endblock %}</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="{{ base }}/static/app.css?v={{ version }}">
  <script src="{{ base }}/static/htmx.min.js?v={{ version }}" defer></script>
  {% block head %}{% endblock %}
  <script>
    // Głęboki link z innego panelu (Budżet Domowy, M29): HA otwiera /app/<slug>/paragony/<id>, ale iframe
    // dostaje tylko korzeń panelu. Ramka ma ten sam origin co HA, więc czytamy adres okna nadrzędnego
    // i raz na wejście przechodzimy do paragonu (powrót na listę już nie przekierowuje).
    try {
      const m = top !== self && top.location.pathname.match(/^\/app\/[^/]+(\/paragony\/[\w-]+)\/?$/);
      if (m && top.__lidlDeep !== top.location.pathname) {
        top.__lidlDeep = top.location.pathname;
        if (location.pathname !== "{{ base }}" + m[1]) location.replace("{{ base }}" + m[1]);
      }
    } catch (e) { /* inny origin albo brak HA — zwykły panel */ }
  </script>
</head>
<body>
  <header class="bar">{% block bar %}<a href="{{ base }}/">Lidl Plus</a>{% endblock %}</header>
  <main class="body"><div class="wrap">
    {% if section %}<nav class="nav" aria-label="Sekcje">
      <a class="ds-chip{% if section == 'kupony' %} ds-chip--on{% endif %}" href="{{ base }}/kupony"{% if section == 'kupony' %} aria-current="page"{% endif %}>Kupony</a>
      <a class="ds-chip{% if section == 'produkty' %} ds-chip--on{% endif %}" href="{{ base }}/produkty"{% if section == 'produkty' %} aria-current="page"{% endif %}>Produkty</a>
      <a class="ds-chip{% if section == 'ceny' %} ds-chip--on{% endif %}" href="{{ base }}/ceny"{% if section == 'ceny' %} aria-current="page"{% endif %}>Ceny</a>
      <a class="ds-chip{% if section == 'paragony' %} ds-chip--on{% endif %}" href="{{ base }}/paragony"{% if section == 'paragony' %} aria-current="page"{% endif %}>Paragony</a>
      <a class="ds-chip{% if section == 'miesiace' %} ds-chip--on{% endif %}" href="{{ base }}/miesiace"{% if section == 'miesiace' %} aria-current="page"{% endif %}>Miesiące</a>
      <a class="ds-chip{% if section == 'rytm' %} ds-chip--on{% endif %}" href="{{ base }}/rytm"{% if section == 'rytm' %} aria-current="page"{% endif %}>Rytm</a>
      <a class="ds-chip{% if section == 'konta' %} ds-chip--on{% endif %}" href="{{ base }}/konta"{% if section == 'konta' %} aria-current="page"{% endif %}>Konta</a>
      <a class="ds-chip{% if section == 'status' %} ds-chip--on{% endif %}" href="{{ base }}/status"{% if section == 'status' %} aria-current="page"{% endif %}>Status{% if alert %}<span class="dot" aria-hidden="true"></span><span class="vh"> — wymaga działania</span>{% endif %}</a>
    </nav>{% endif %}
    {% block main %}{% endblock %}
  </div></main>
  <footer class="body" style="padding-top: 0"><div class="wrap"><div class="foot">Nieoficjalny add-on, niepowiązany z Lidl · Wersja {{ version }}</div></div></footer>
  <script>
    // Zakładki (data-tab): klik rozwija swój panel i zwija pozostałe, ponowny klik zwija; otwarta zakładka
    // przetrwa podmiany htmx (odświeżanie w trakcie sprawdzania, „Aktywuj”, wyszukiwanie).
    (() => {
      let open = null;
      const apply = () => {
        if (open === null) return;
        for (const b of document.querySelectorAll("[data-tab]")) {
          const id = b.getAttribute("aria-controls");
          b.setAttribute("aria-expanded", String(id === open));
          document.getElementById(id)?.toggleAttribute("hidden", id !== open);
        }
      };
      document.addEventListener("click", (e) => {
        const b = e.target.closest("[data-tab]");
        if (!b) return;
        open = b.getAttribute("aria-expanded") === "true" ? "" : b.getAttribute("aria-controls");
        apply();
      });
      document.addEventListener("htmx:afterSettle", apply);
    })();
  </script>
</body>
</html>
