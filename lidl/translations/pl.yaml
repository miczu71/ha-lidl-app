configuration:
  log_level:
    name: Poziom logów
    description: Szczegółowość logów add-onu (debug nie wypisuje tokenów ani kodów logowania).
  auto_activate:
    name: Automatyczna aktywacja kuponów
    description: >-
      Aktywuje na każdym koncie kupony ogólne i kupony na produkty z zakładki Kupony. Wyłączone = tryb
      próbny: panel i powiadomienie pokazują tylko, co zostałoby aktywowane.
  run_time:
    name: Godzina dziennego przebiegu
    description: >-
      Codziennie o tej godzinie (GG:MM, czas lokalny) add-on pobiera nowe paragony, aktywuje kupony i wysyła
      powiadomienie na notify.family.
  llm_url:
    name: Adres API modelu językowego
    description: >-
      Adres zgodny z OpenAI (np. http://192.168.0.10:3003/v1) do odczytu promocji z gazetki. Puste = gazetka
      wyłączona (promocje z lidl.pl i ofert sklepu działają dalej).
  llm_key:
    name: Klucz API modelu językowego
    description: Klucz do adresu powyżej (Bearer). Puste = gazetka wyłączona.
  llm_vision_models:
    name: Modele wizyjne (kolejność)
    description: >-
      Modele czytające obrazy stron gazetki (po 5 stron na zapytanie); przy limicie add-on próbuje następnego.
  llm_fallback_models:
    name: Modele awaryjne gazetki
    description: >-
      Dochodzą do kolejki, gdy modele wizyjne zawodzą kilka rund z rzędu. Szybsze, ale mniej dokładne — ich oferty
      muszą mieć wspólne słowo z nazwą Twojego produktu. Pusta lista = bez modeli awaryjnych.
  alert_notify:
    name: Powiadomienie o problemach
    description: >-
      Usługa notify (bez „notify.”, np. moj_telefon), która dostaje push, gdy coś wymaga działania: wygasła sesja
      konta, nieudany lub pominięty poranny przebieg, odrzucony klucz AI, odłożona paczka gazetki. Raz na problem.
      Puste = tylko kropka przy zakładce Status.
