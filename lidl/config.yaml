name: "Lidl Plus"
version: "0.14.3"
slug: lidl
description: "Paragony, kupony i gazetki Lidl Plus dla kilku kont (nieoficjalny)"
url: "https://github.com/miczu71/ha-lidl-app"
arch:
  - aarch64
  - amd64
init: false
startup: application
boot: auto
ingress: true
ingress_port: 8099
panel_icon: mdi:cart-outline
panel_title: "Lidl"
panel_admin: true
homeassistant_api: true
options:
  log_level: info
  auto_activate: false
  run_time: "07:00"
  llm_url: ""
  llm_key: ""
  llm_vision_models:
    - gemini-3.5-flash
    - gemini-3.6-flash
    - gemini-3.7-flash
    - gemma-4-31b-it
schema:
  log_level: "list(debug|info|warning|error)"
  auto_activate: bool
  run_time: "match(^([01][0-9]|2[0-3]):[0-5][0-9]$)"
  llm_url: "str?"
  llm_key: "password?"
  llm_vision_models:
    - str
